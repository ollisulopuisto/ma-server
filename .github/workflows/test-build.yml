---
name: Test build

# Builds a throwaway Music Assistant image from a branch of this fork and pushes it to this
# fork's own GHCR namespace, so a change can be tried on a real Home Assistant box before it
# goes anywhere near upstream. This workflow is fork-local scaffolding and is not meant to be
# contributed back - the real release pipeline lives in release.yml and needs credentials a
# fork does not have.
#
# It runs on a push to its own branch rather than on workflow_dispatch, because a dispatchable
# workflow has to live on the repository's default branch and this one deliberately does not.
# To rebuild, bump "version" in the add-on config and push: that file is the single source of
# truth for the image tag, so the tag and the add-on version cannot drift apart.

on:
  push:
    branches:
      - claude/test-build-addon
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit SHA to build"
        required: false
        type: string

permissions:
  contents: read
  packages: write

# two runs would push the same tags and their manifest jobs would interleave, so a new run
# waits for the one in flight rather than racing it
concurrency:
  group: test-build
  cancel-in-progress: false

env:
  # must match the base image the Dockerfile of the built ref expects (see release.yml)
  BASE_IMAGE_VERSION: "1.6.3"
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ma-server-test
  DEFAULT_REF: claude/pocket-casts-up-next-yax9xw
  ADDON_CONFIG: addon/ma_upnext_test/config.yaml

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    strategy:
      # one architecture failing should not throw away the other, which may be the one needed
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out this branch for the add-on config
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Resolve the version from the add-on config
        id: resolve
        run: |
          # tolerate the value being quoted or padded in the yaml; the tag must not carry it
          version=$(sed -n 's/^version:[[:space:]]*//p' "$ADDON_CONFIG" | head -1 | tr -d "\"' \t\r")
          if [ -z "$version" ]; then
            echo "no version found in $ADDON_CONFIG" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building version $version"

      - name: Check out the ref to build
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref || env.DEFAULT_REF }}
          path: source

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version-file: source/.python-version

      - name: Stamp the version into pyproject.toml
        working-directory: source
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          path = Path("pyproject.toml")
          # the repo ships a 0.0.0 placeholder that the real release workflow rewrites too
          text, count = re.subn(
              r'(?m)^version = "0\.0\.0"$', f'version = "{version}"', path.read_text()
          )
          if count != 1:
              raise SystemExit(f"expected 1 version placeholder in pyproject.toml, found {count}")
          path.write_text(text)
          PY

      - name: Build the wheel the image installs
        working-directory: source
        run: |
          python -m pip install --upgrade build
          python -m build --wheel --outdir dist
          ls -l dist

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push the per-architecture image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: source
          file: source/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          # attestations turn the tag into an index the Supervisor cannot resolve to an image
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE_NAME }}:${{ steps.resolve.outputs.version }}-${{ matrix.arch }}
          build-args: |
            BASE_IMAGE_VERSION=${{ env.BASE_IMAGE_VERSION }}
            MASS_VERSION=${{ steps.resolve.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  manifest:
    name: Publish the multi-arch tag
    needs: build
    # the add-on config names the plain version tag, so it has to be published even when only
    # one architecture built - otherwise a single failed arch leaves nothing installable
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # the Home Assistant Supervisor pulls one tag and picks the architecture itself, so the
      # two per-arch images are joined under the plain version tag the add-on config names
      - name: Join whichever per-architecture images were published under one tag
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [ -z "$VERSION" ]; then
            echo "no version from the build job - every architecture failed before resolving it" >&2
            exit 1
          fi
          sources=""
          for arch in amd64 arm64; do
            if docker buildx imagetools inspect "${IMAGE_NAME}:${VERSION}-${arch}" >/dev/null 2>&1
            then
              sources="$sources ${IMAGE_NAME}:${VERSION}-${arch}"
            else
              echo "::warning::no ${arch} image for ${VERSION}; the tag will not serve ${arch}"
            fi
          done
          if [ -z "$sources" ]; then
            echo "no architecture images were published for ${VERSION}" >&2
            exit 1
          fi
          # shellcheck disable=SC2086
          docker buildx imagetools create --tag "${IMAGE_NAME}:${VERSION}" $sources
          docker buildx imagetools inspect "${IMAGE_NAME}:${VERSION}"
